# 無料の静的サイトだけ。Postgres / Key Value / ディスク / 有料プランは作らない。
services:
  - type: web
    name: shop-chatbot-demo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://ofpaiegiilfxloprmcwi.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /embed.js
        name: Cache-Control
        value: public, max-age=300
      - path: /widget/*
        name: Content-Security-Policy
        value: frame-ancestors *
      - path: /admin
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /admin
        name: X-Frame-Options
        value: DENY
      - path: /admin/*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /admin/*
        name: X-Frame-Options
        value: DENY
      - path: /admin
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /admin/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /widget/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /reserve/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /shop-demo
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /shop-demo/*
        name: X-Robots-Tag
        value: noindex, nofollow
