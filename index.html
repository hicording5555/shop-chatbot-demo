<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>お店のホームページで、よくある質問に答えます｜ARK</title>
    <style>
      html.admin-lock body { visibility: hidden !important; }
    </style>
    <script>
      (function () {
        var path = (location.pathname || '/').replace(/\/+$/, '') || '/';
        var prefixes = ['/admin', '/widget', '/reserve', '/shop-demo'];
        var hide = false;
        for (var i = 0; i < prefixes.length; i++) {
          var prefix = prefixes[i];
          if (path === prefix || path.indexOf(prefix + '/') === 0) hide = true;
        }
        if (hide) {
          var meta = document.createElement('meta');
          meta.name = 'robots';
          meta.content = 'noindex, nofollow';
          document.head.appendChild(meta);
        }
        if (path !== '/admin' && path.indexOf('/admin/') !== 0) return;
        document.documentElement.classList.add('admin-lock');
        var framed = false;
        try { framed = window.top !== window.self; } catch (e) { framed = true; }
        if (!framed) {
          document.documentElement.classList.remove('admin-lock');
          return;
        }
        try { window.top.location = window.self.location; } catch (e) {}
        window.__SHOP_ADMIN_FRAMED = true;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>このページの表示にはJavaScriptが必要です。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
