<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>店ボット・デモ</title>
    <style>
      html.admin-lock body { visibility: hidden !important; }
    </style>
    <script>
      (function () {
        var path = (location.pathname || '/').replace(/\/+$/, '') || '/';
        if (path !== '/admin' && path.indexOf('/admin/') !== 0) return;
        document.documentElement.classList.add('admin-lock');
        var framed = false;
        try { framed = window.top !== window.self; } catch (e) { framed = true; }
        if (!framed) {
          document.documentElement.classList.remove('admin-lock');
          return;
        }
        try { window.top.location = window.self.location; } catch (e) {}
        window.__SHOP_ADMIN_FRAMED = true;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>このデモはJavaScriptが必要です。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
